# Builds the binding and publishes the JAR as a GitHub release when a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check that the pom version matches the tag
        run: |
          VERSION=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "pom.xml version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build with tests and static code analysis
        run: mvn -B -ntp clean install

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="target/org.openhab.binding.googledrive-$VERSION.jar"
          PRERELEASE=""
          case "$VERSION" in 0.*) PRERELEASE="--prerelease" ;; esac
          NOTES="docs/releases/$VERSION.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Tag was pushed again: only replace the JAR of the existing release.
            gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$JAR" \
              --title "Google Drive Binding $VERSION" $PRERELEASE "${NOTES_ARG[@]}"
          fi
