# add-on

addon.googledrive.name = Google Drive Binding
addon.googledrive.description = Lädt openHAB-Backups zu Google Drive hoch und räumt alte Backups auf.

# thing types

thing-type.googledrive.account.label = Google-Drive-Konto
thing-type.googledrive.account.description = Verbindung zu einem Google-Drive-Konto. Die Anmeldung erfolgt mit einem Gerätecode auf google.com/device.
thing-type.googledrive.backup.label = Backup-Upload
thing-type.googledrive.backup.description = Überwacht den lokalen Backup-Ordner und lädt neue Backups in einen Google-Drive-Ordner hoch.

# thing types config

thing-type.config.googledrive.account.clientId.label = Client-ID
thing-type.config.googledrive.account.clientId.description = OAuth-Client-ID vom Typ "Fernseher und Geräte mit begrenzter Eingabe" aus der Google Cloud Console.
thing-type.config.googledrive.account.clientSecret.label = Client-Secret
thing-type.config.googledrive.account.clientSecret.description = OAuth-Client-Secret zur Client-ID.
thing-type.config.googledrive.account.quotaRefresh.label = Intervall Speicherplatz
thing-type.config.googledrive.account.quotaRefresh.description = Intervall in Minuten zum Abfragen des Speicherplatzes. 0 schaltet die Abfrage aus.
thing-type.config.googledrive.backup.autoUpload.label = Automatischer Upload
thing-type.config.googledrive.backup.autoUpload.description = Neue Backups automatisch hochladen. Ausgeschaltet wird nur auf Befehl hochgeladen.
thing-type.config.googledrive.backup.deleteLocalAfterUpload.label = Lokal löschen nach Upload
thing-type.config.googledrive.backup.deleteLocalAfterUpload.description = Lokale Datei löschen, nachdem der Upload bestätigt wurde.
thing-type.config.googledrive.backup.filePattern.label = Dateimuster
thing-type.config.googledrive.backup.filePattern.description = Glob-Muster der hochzuladenden Backup-Dateien.
thing-type.config.googledrive.backup.retentionCount.label = Anzahl behaltener Backups
thing-type.config.googledrive.backup.retentionCount.description = Anzahl Backups, die in Google Drive behalten werden. Ältere werden entfernt. 0 behält alle.
thing-type.config.googledrive.backup.localRetentionCount.label = Backups auf dem Server behalten
thing-type.config.googledrive.backup.localRetentionCount.description = Anzahl Backups, die im lokalen Quellordner bleiben. Ältere werden gelöscht, aber nur wenn sie in Google Drive liegen oder älter als das neueste Backup in Google Drive sind. 0 behält alle.
thing-type.config.googledrive.backup.retentionMode.label = Entfernen
thing-type.config.googledrive.backup.retentionMode.description = Wie alte Backups aus Google Drive entfernt werden.
thing-type.config.googledrive.backup.retentionMode.option.TRASH = In den Papierkorb
thing-type.config.googledrive.backup.retentionMode.option.DELETE = Endgültig löschen
thing-type.config.googledrive.backup.sourceFolder.label = Quellordner
thing-type.config.googledrive.backup.sourceFolder.description = Lokaler Ordner mit den Backups. Leer bedeutet den openHAB-Standardordner (userdata/backup).
thing-type.config.googledrive.backup.stableSeconds.label = Wartezeit
thing-type.config.googledrive.backup.stableSeconds.description = Sekunden, die sich die Dateigröße nicht ändern darf, bevor die Datei als fertig gilt.
thing-type.config.googledrive.backup.targetFolder.label = Zielordner
thing-type.config.googledrive.backup.targetFolder.description = Name des Ordners in Google Drive. Er wird angelegt, falls er nicht existiert.
thing-type.config.googledrive.backup.uploadExistingOnStart.label = Vorhandene beim Start hochladen
thing-type.config.googledrive.backup.uploadExistingOnStart.description = Beim Start lokale Backups hochladen, die noch nicht in Google Drive sind.

# channel types

channel-type.googledrive.event.label = Upload-Ereignis
channel-type.googledrive.event.description = Wird ausgelöst, wenn ein Upload startet, erfolgreich ist oder fehlschlägt
channel-type.googledrive.event.event.option.UPLOAD_STARTED = Upload gestartet
channel-type.googledrive.event.event.option.UPLOAD_SUCCESS = Upload erfolgreich
channel-type.googledrive.event.event.option.UPLOAD_FAILED = Upload fehlgeschlagen
channel-type.googledrive.lastError.label = Letzter Fehler
channel-type.googledrive.lastError.description = Letzte Fehlermeldung, leer nach erfolgreichem Upload
channel-type.googledrive.lastFile.label = Letzte Datei
channel-type.googledrive.lastFile.description = Name der zuletzt hochgeladenen Datei
channel-type.googledrive.lastSize.label = Letzte Größe
channel-type.googledrive.lastSize.description = Größe der zuletzt hochgeladenen Datei
channel-type.googledrive.lastUpload.label = Letzter Upload
channel-type.googledrive.lastUpload.description = Zeitpunkt des letzten erfolgreichen Uploads
channel-type.googledrive.loginCode.label = Anmeldecode
channel-type.googledrive.loginCode.description = Code zur Eingabe auf google.com/device. Leer, wenn angemeldet.
channel-type.googledrive.progress.label = Fortschritt
channel-type.googledrive.progress.description = Fortschritt des laufenden Uploads
channel-type.googledrive.quotaTotal.label = Speicher gesamt
channel-type.googledrive.quotaTotal.description = Gesamtspeicher des Google-Kontos (leer bei unbegrenzt)
channel-type.googledrive.quotaUsed.label = Speicher belegt
channel-type.googledrive.quotaUsed.description = Belegter Speicher im Google-Konto
channel-type.googledrive.remoteCount.label = Backups in Drive
channel-type.googledrive.remoteCount.description = Anzahl Backups im Google-Drive-Ordner
channel-type.googledrive.status.label = Status
channel-type.googledrive.status.description = Aktueller Upload-Status
channel-type.googledrive.status.state.option.IDLE = Bereit
channel-type.googledrive.status.state.option.WAITING = Warte auf Datei
channel-type.googledrive.status.state.option.UPLOADING = Lädt hoch
channel-type.googledrive.status.state.option.OK = OK
channel-type.googledrive.status.state.option.ERROR = Fehler
channel-type.googledrive.upload.label = Jetzt hochladen
channel-type.googledrive.upload.description = ON lädt das neueste lokale Backup sofort hoch

# thing status descriptions

offline.config-error.missing-client = Client-ID und Client-Secret müssen eingetragen sein.
offline.config-error.invalid-client = Google hat den OAuth-Client abgelehnt ({0}). Prüfe Client-ID und Secret und dass der Client-Typ "Fernseher und Geräte mit begrenzter Eingabe" ist.
offline.config-error.access-denied = Der Zugriff wurde auf der Google-Anmeldeseite abgelehnt. Führe die Aktion "Abmelden" aus oder aktiviere das Thing neu, um dich erneut anzumelden.
offline.config-pending.login = Öffne {0} und gib den Code {1} ein
offline.config-error.source-folder-missing = Quellordner {0} existiert nicht.

# actions

action.logout.label = Abmelden
action.logout.description = Entfernt die gespeicherte Google-Anmeldung und startet eine neue Anmeldung.
action.upload-latest.label = Neuestes Backup hochladen
action.upload-latest.description = Lädt das neueste lokale Backup zu Google Drive hoch.
action.upload-file.label = Backup-Datei hochladen
action.upload-file.description = Lädt eine Backup-Datei aus dem Quellordner zu Google Drive hoch.
action.cleanup.label = Aufräumen
action.cleanup.description = Entfernt alte Backups aus Google Drive gemäß der Anzahl behaltener Backups.
action.input.file-name.label = Dateiname
action.output.queued.label = Eingereiht
