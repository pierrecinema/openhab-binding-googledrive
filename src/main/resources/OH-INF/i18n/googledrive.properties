# add-on

addon.googledrive.name = Google Drive Binding
addon.googledrive.description = Uploads openHAB backups to Google Drive and cleans up old backups.

# thing status descriptions

offline.config-error.missing-client = Client ID and client secret must be configured.
offline.config-error.invalid-client = Google rejected the OAuth client ({0}). Check client ID and secret and that the client type is "TVs and Limited Input devices".
offline.config-error.access-denied = Access was denied on the Google login page. Run the logout action or re-enable the thing to log in again.
offline.config-pending.login = Open {0} and enter the code {1}
offline.config-error.source-folder-missing = Source folder {0} does not exist.

# actions

action.logout.label = Log Out
action.logout.description = Removes the stored Google login and starts a new login.
action.upload-latest.label = Upload Latest Backup
action.upload-latest.description = Uploads the newest local backup to Google Drive.
action.upload-file.label = Upload Backup File
action.upload-file.description = Uploads a backup file from the source folder to Google Drive.
action.cleanup.label = Clean Up
action.cleanup.description = Removes old backups from Google Drive according to the number of backups to keep.
action.input.file-name.label = File Name
action.output.queued.label = Queued
